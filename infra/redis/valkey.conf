# Valkey configuration for Ouija's Redis instance (BullMQ job queue).
#
# POLICY: noeviction
# BullMQ requires that delayed jobs are NEVER evicted. If Redis runs out of
# memory and evicts a delayed job, the dead man's switch (stall monitor) fires
# a false-positive and the pipeline is incorrectly marked as stalled.
# noeviction causes BullMQ to receive an OOM error instead — which is loud and
# recoverable rather than silently wrong.

# Memory limit — matches the deploy.resources.limits.memory in docker-compose.
maxmemory 256mb
maxmemory-policy noeviction

# Persistence: append-only file with fsync every second.
# This gives us at most 1 second of data loss on a hard crash while keeping
# write throughput reasonable.
appendonly yes
appendfsync everysec

# Disable the default RDB snapshotting — AOF is our persistence strategy.
save ""
