name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      # Tenet 4 drift-check: TypeScript generates the status check-constraint
      # migration. If PIPELINE_STATUSES moves without the committed SQL being
      # regenerated, this step fails the PR.
      - name: check migration drift (PIPELINE_STATUSES → 006-status-enum.sql)
        run: npm run gen:migrations:check

  # Exercise the real self-hoster install path: `npx @ouija-dev/cli@<sha> init`
  # in an empty directory, then `ouija up` boots the stack. Catches regressions
  # in the packaged assets (wrong env_file path, stale image tag, missing
  # compose files) that in-monorepo tests can't see.
  #
  # Runs against the CLI built from this PR (npm pack + npx <tarball>) rather
  # than a published version so we test the change, not yesterday's release.
  fresh-install-smoke:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pack just the CLI. Its packaged assets include the compose files we
      # need to validate.
      - name: pack cli
        id: pack
        run: |
          cd packages/cli
          tarball=$(npm pack --silent)
          echo "tarball=$(pwd)/$tarball" >> "$GITHUB_OUTPUT"

      # Init in a fresh empty directory under runner temp. Mirrors what a
      # self-hoster running `npx @ouija-dev/cli init` sees.
      - name: fresh init + validate compose
        run: |
          set -euo pipefail
          export CI_SMOKE_DIR="$RUNNER_TEMP/ouija-fresh"
          mkdir -p "$CI_SMOKE_DIR"
          cd "$CI_SMOKE_DIR"
          # Install the CLI tarball locally, then invoke the binary directly.
          # `npx --yes <tarball>` tries to execute the tarball file itself,
          # which shells out to sh and errors with EACCES on macOS + Linux.
          npm init -y > /dev/null
          npm install "${{ steps.pack.outputs.tarball }}"
          # Phase 3 Task 10: --preset self-hosted-plane removed. The smoke
          # uses byo-kanban (the default for `ouija watch` flows) since
          # that's the path most self-hosters land on now.
          ./node_modules/.bin/ouija init --preset byo-kanban -y
          # Clean up the installer scaffolding so the init-generated files
          # are the only thing left for the compose check.
          rm -rf node_modules package.json package-lock.json

          # Files we expect the init to have created.
          for f in .env ouija.config.yaml docker/docker-compose.ouija.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::expected file missing: $f"
              exit 1
            fi
          done

          # Docker Compose `config` normalises the file — fails loud on:
          #  - wrong env_file paths
          #  - unresolvable image references
          #  - missing build contexts
          # which were the two bugs that shipped in v0.3.0.
          docker compose \
            --project-directory "$CI_SMOKE_DIR" \
            -f docker/docker-compose.ouija.yml \
            config > /tmp/compose-rendered.yml

          # Assert the `ouija` service is defined as a registry image on GHCR.
          # A `build:` stanza may also be present (it's kept as a monorepo-dev
          # override) but `docker compose up` honours `image:` first and never
          # triggers `build:` unless `--build` is passed. We only care that
          # self-hosters without source can pull + run.
          python3 - <<'PY'
          import sys, yaml
          with open('/tmp/compose-rendered.yml') as f:
              doc = yaml.safe_load(f)
          svc = doc.get('services', {}).get('ouija', {})
          image = svc.get('image', '')
          if not image.startswith('ghcr.io/muhammadkh4n/ouija:'):
              print(f"::error::services.ouija.image expected 'ghcr.io/muhammadkh4n/ouija:<tag>', got '{image}'")
              sys.exit(1)
          # If a build stanza is present, its context path must resolve to the
          # cli-installed workspace (so it's benign for self-hosters). We don't
          # require its absence — having it enables `docker compose build` in
          # the monorepo without a separate override file.
          print(f"services.ouija.image = {image}")
          print("fresh-install compose validates ✓")
          PY

      # Actually boot the server container against Postgres + Redis and curl
      # /healthz. Catches missing-package-in-image bugs that the config-only
      # check above doesn't see (e.g. server imports @ouija-dev/config but
      # Dockerfile forgot to COPY packages/config/ into the production stage).
      - name: Build local image for boot smoke
        run: docker build -t ouija:ci -f docker/Dockerfile .

      - name: Boot server + hit /healthz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ouija-fresh"
          # Point the compose at the locally-built image so we don't need
          # a registry pull.
          export OUIJA_IMAGE=ouija:ci
          # Phase 3 Task 8: agent-worker fail-loud's at startup if no
          # AuthProvider auto-detects. The smoke doesn't dispatch anything
          # real, but the worker still needs ONE provider to be detectable
          # so the boot sequence finishes. EnvProvider with a placeholder
          # value is the cheapest path — the key never gets used.
          export ANTHROPIC_API_KEY=sk-ant-ci-smoke-placeholder
          docker compose \
            --project-directory . \
            -f docker/docker-compose.ouija.yml \
            up -d
          # Give the container up to 60s to start + migrate. /healthz is
          # served by the same Fastify app that handles dispatches, so a
          # 200 here proves the entire import graph is resolvable.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/healthz >/dev/null 2>&1; then
              echo "server healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:4000/healthz; then
            echo "::error::server failed to become healthy — dumping logs"
            docker compose --project-directory . -f docker/docker-compose.ouija.yml logs ouija
            exit 1
          fi
          echo ""
          docker compose --project-directory . -f docker/docker-compose.ouija.yml down -v

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 3 Task 11 — Fizzy preset smoke. Mirrors `fresh-install-smoke`
  # but boots `--preset self-hosted-fizzy` so the only kanban path we
  # ship is exercised every PR. Catches:
  #   - Fizzy image (ghcr.io/basecamp/fizzy:main) can't be pulled.
  #   - docker-compose.fizzy.yml syntax / env / volume regressions.
  #   - Ouija's `depends_on: fizzy` doesn't deadlock on the start path.
  #   - Anything Phase 3 Task 8's identity-layer wiring breaks under
  #     the Fizzy compose specifically (the env-var plumbing differs
  #     slightly from the BYO-kanban compose, and that's exactly the
  #     class of asymmetry that bit Task 8's first CI run).
  # Validates the boot side of Phase 3 Task 7's check (b) — the image
  # actually starts with the new identity layer in place. The deeper
  # "Claude CLI authenticates from a materialised .credentials.json
  # inside a real dispatch" assertion is post-v0.5.0 work; it needs a
  # mocked claude binary or a real subscription token in CI, both of
  # which are larger pieces than this smoke gate.
  fresh-install-fizzy-smoke:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: pack cli
        id: pack
        run: |
          cd packages/cli
          tarball=$(npm pack --silent)
          echo "tarball=$(pwd)/$tarball" >> "$GITHUB_OUTPUT"

      - name: fresh init + validate fizzy compose
        run: |
          set -euo pipefail
          export CI_SMOKE_DIR="$RUNNER_TEMP/ouija-fresh-fizzy"
          mkdir -p "$CI_SMOKE_DIR"
          cd "$CI_SMOKE_DIR"
          npm init -y > /dev/null
          npm install "${{ steps.pack.outputs.tarball }}"
          ./node_modules/.bin/ouija init --preset self-hosted-fizzy -y
          rm -rf node_modules package.json package-lock.json

          # Phase 3 Task 11: --preset self-hosted-fizzy ships this compose.
          for f in .env ouija.config.yaml docker/docker-compose.fizzy.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::expected file missing: $f"
              exit 1
            fi
          done
          # The legacy Plane bundle is gone (Task 10).
          if [ -f docker/docker-compose.yml ]; then
            echo "::error::docker/docker-compose.yml shouldn't ship in v0.5.0"
            exit 1
          fi

          docker compose \
            --project-directory "$CI_SMOKE_DIR" \
            -f docker/docker-compose.fizzy.yml \
            config > /tmp/compose-rendered-fizzy.yml

          python3 - <<'PY'
          import sys, yaml
          with open('/tmp/compose-rendered-fizzy.yml') as f:
              doc = yaml.safe_load(f)
          services = doc.get('services', {})
          ouija_svc = services.get('ouija', {})
          fizzy_svc = services.get('fizzy', {})
          ouija_image = ouija_svc.get('image', '')
          fizzy_image = fizzy_svc.get('image', '')
          if not ouija_image.startswith('ghcr.io/muhammadkh4n/ouija:'):
              print(f"::error::services.ouija.image expected 'ghcr.io/muhammadkh4n/ouija:<tag>', got '{ouija_image}'")
              sys.exit(1)
          if 'fizzy' not in fizzy_image:
              print(f"::error::services.fizzy.image expected to reference fizzy, got '{fizzy_image}'")
              sys.exit(1)
          # Must depend on fizzy so the smoke flow has a kanban backend live.
          deps = ouija_svc.get('depends_on', {})
          if 'fizzy' not in deps:
              print(f"::error::services.ouija.depends_on must include `fizzy`; got {list(deps)}")
              sys.exit(1)
          # Phase 3 Task 8 — confirm tmpfs for /run/ouija/claude-home is set.
          tmpfs = ouija_svc.get('tmpfs', [])
          if not any('/run/ouija/claude-home' in t for t in tmpfs):
              print(f"::error::services.ouija.tmpfs must include /run/ouija/claude-home; got {tmpfs}")
              sys.exit(1)
          print(f"services.ouija.image = {ouija_image}")
          print(f"services.fizzy.image = {fizzy_image}")
          print("fresh-install-fizzy compose validates ✓")
          PY

      - name: Build local image for boot smoke
        run: docker build -t ouija:ci -f docker/Dockerfile .

      - name: Boot fizzy stack + hit /healthz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ouija-fresh-fizzy"
          export OUIJA_IMAGE=ouija:ci
          # Phase 3 Task 8: agent-worker fail-loud's at startup if no
          # AuthProvider auto-detects. Placeholder ANTHROPIC_API_KEY for
          # EnvProvider; never used (no real dispatch in this smoke).
          export ANTHROPIC_API_KEY=sk-ant-ci-smoke-placeholder
          docker compose \
            --project-directory . \
            -f docker/docker-compose.fizzy.yml \
            up -d
          # Fizzy needs longer than the BYO smoke — Rails migrations run
          # on first boot. Give it 120s before declaring failure.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4000/healthz >/dev/null 2>&1; then
              echo "ouija healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:4000/healthz; then
            echo "::error::ouija failed to become healthy — dumping logs"
            docker compose --project-directory . -f docker/docker-compose.fizzy.yml logs ouija
            docker compose --project-directory . -f docker/docker-compose.fizzy.yml logs fizzy
            exit 1
          fi
          # Fizzy's /up readiness probe should also be reachable from the
          # host (port 3333 → fizzy:3000). Catches Fizzy mis-pull /
          # mis-configuration distinctly from Ouija boot regressions.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3333/up >/dev/null 2>&1; then
              echo "fizzy /up healthy after ${i}s"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:3333/up; then
            echo "::error::fizzy failed to become healthy — dumping logs"
            docker compose --project-directory . -f docker/docker-compose.fizzy.yml logs fizzy
            exit 1
          fi
          echo ""
          docker compose --project-directory . -f docker/docker-compose.fizzy.yml down -v
