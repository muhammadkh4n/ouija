name: Docker image

# Build + push the Ouija server image to GHCR so self-hosters running
# `npx @ouija-dev/cli up` pull a prebuilt container instead of needing the
# monorepo source. Fires on v-tag push alongside the npm publish workflow.

on:
  push:
    tags:
      - "v*"
  # Allow manual re-runs for the current tag (e.g. to rebuild after a runtime
  # base image CVE) without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.3.1)"
        required: true
        default: "latest"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Derive image tag from git ref
        id: meta
        run: |
          # When fired by a tag push, strip the leading "v". Otherwise use
          # the workflow_dispatch input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Tag with both the exact version and `latest` so self-hosters
          # who pin `ghcr.io/muhammadkh4n/ouija:0.3.1` get reproducible
          # builds while unpinned consumers track the newest release.
          tags: |
            ghcr.io/muhammadkh4n/ouija:${{ steps.meta.outputs.tag }}
            ghcr.io/muhammadkh4n/ouija:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Emit provenance attestations so consumers can verify the image
          # was built by this workflow (matches the npm --provenance path).
          provenance: true
          sbom: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Docker image publish (${{ github.ref_name }})"
            echo ""
            echo "Pushed:"
            echo "- \`ghcr.io/muhammadkh4n/ouija:${{ steps.meta.outputs.tag }}\`"
            echo "- \`ghcr.io/muhammadkh4n/ouija:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
