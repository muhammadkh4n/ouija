# ouija.config.yaml — self-hosted-plane preset
#
# Generated by `npx @ouija-dev/cli init --preset self-hosted-plane`.
# Works out of the box once `ouija up` seeds a Plane workspace and you have
# an API token. Targets the ouija-demo-template repo for first-run safety —
# swap the repos[].url below to your real project when ready.
#
# See docs/configuration.md for the full reference.

claudeHome: null

agents:
  - id: rex-coder
    name: Rex Coder
    email: rex@ouija.local
    triggerMode: auto
    runner: stream-json
    model: claude-sonnet-4-20250514
    systemPrompt: |
      You are Rex, an expert software engineer. Take the task described by the
      kanban card and deliver a small, focused pull request.

      Rules:
        - Prefer minimal diffs. Don't refactor unrelated code.
        - Run `npm test` before committing.
        - Commit messages: imperative mood, one short line.
        - Open the PR against `main`.
        - Don't auto-merge. The human reviews and merges.

    auth:
      method: api-key
      secretRef: env:ANTHROPIC_API_KEY

    repos:
      # Default target: the safe throwaway repo. Swap to your project when ready.
      - url: https://github.com/muhammadkh4n/ouija-demo-template.git
        baseBranch: main
        default: true

    limits:
      maxDurationMs: 1800000      # 30 min
      stallThresholdMs: 300000    # 5 min

boards:
  # Plane auto-creates this project on first boot if the UUID doesn't exist.
  # Replace with your real project UUID once you've switched target repos.
  - projectId: 00000000-0000-0000-0000-000000000001
    autoStartOnAssign: true
    columns:
      - name: In Progress
        action: dispatch_agent
        agentId: rex-coder
      - name: Done
        action: close_and_notify
