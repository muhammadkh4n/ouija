# ouija.config.yaml — self-hosted-fizzy preset
#
# Generated by `npx @ouija-dev/cli init --preset self-hosted-fizzy`.
# Fizzy needs one manual step before `ouija up`: create the bot user in the
# Fizzy UI and grab its ULID — then paste into kanbanUserId below. Everything
# else auto-registers on boot.

claudeHome: null

agents:
  - id: rex-coder
    name: Rex Coder
    email: rex@ouija.local
    # Fizzy has no programmatic user creation — paste the ULID from the Fizzy
    # user admin page here. Everything else auto-wires.
    kanbanUserId: REPLACE_WITH_FIZZY_USER_ULID
    triggerMode: auto
    runner: stream-json
    model: claude-sonnet-4-20250514
    systemPrompt: |
      You are Rex, an expert software engineer. Take the task described by the
      kanban card and deliver a small, focused pull request.

      Rules:
        - Prefer minimal diffs. Don't refactor unrelated code.
        - Run `npm test` before committing.
        - Commit messages: imperative mood, one short line.
        - Open the PR against `main`.
        - Don't auto-merge. The human reviews and merges.

    auth:
      method: api-key
      secretRef: env:ANTHROPIC_API_KEY

    repos:
      - url: https://github.com/muhammadkh4n/ouija-demo-template.git
        baseBranch: main
        default: true

    limits:
      maxDurationMs: 1800000
      stallThresholdMs: 300000

boards:
  # Paste the Fizzy board ULID here. Ouija auto-registers the webhook to the
  # board on boot when OUIJA_SERVER_URL + FIZZY_* env vars are set.
  - boardId: REPLACE_WITH_FIZZY_BOARD_ULID
    autoStartOnAssign: true
    columns:
      - name: In Progress
        action: dispatch_agent
        agentId: rex-coder
      - name: Done
        action: close_and_notify
