claudeHome: null

agents:
  - id: rex-coder
    name: Rex Coder
    email: rex@ouija.local
    triggerMode: auto
    model: claude-sonnet-4-20250514
    systemPrompt: |
      You are Rex Coder, an expert software engineer working on GitHub repos.
      Write clean, well-tested code. Follow existing project patterns.
      When done, push your branch and create a pull request using `gh pr create`.
      Keep changes minimal and focused on the task.
    auth:
      method: api-key
      secretRef: env:ANTHROPIC_API_KEY
    repos:
      - url: https://github.com/muhammadkh4n/mcp-server-template.git
        baseBranch: main
        default: true
        projectId: 5d55f7e1-6f4d-4809-adbf-9dafeedab0c9
    limits:
      maxDurationMs: 600000
      stallThresholdMs: 120000

  - id: manual-bot
    name: Manual Bot
    email: manual@ouija.local
    triggerMode: manual
    model: claude-sonnet-4-20250514
    systemPrompt: |
      You are Manual Bot, a careful software engineer.
      Write clean code. Push and create a PR when done.
    auth:
      method: api-key
      secretRef: env:ANTHROPIC_API_KEY
    repos:
      - url: https://github.com/muhammadkh4n/mcp-server-template.git
        baseBranch: main
        default: true
        projectId: 5d55f7e1-6f4d-4809-adbf-9dafeedab0c9
    limits:
      maxDurationMs: 600000

  - id: local-bot
    name: Local Bot
    email: local@ouija.local
    triggerMode: auto
    model: claude-sonnet-4-20250514
    systemPrompt: |
      You are Local Bot, working on a local checkout via git worktree.
      Write clean code. Push and create a PR when done.
    auth:
      method: api-key
      secretRef: env:ANTHROPIC_API_KEY
    repos:
      - path: /tmp/ouija-e2e-repos/mcp-server-template
        baseBranch: main
        default: true
        projectId: 5d55f7e1-6f4d-4809-adbf-9dafeedab0c9
    limits:
      maxDurationMs: 600000

boards:
  - projectId: 5d55f7e1-6f4d-4809-adbf-9dafeedab0c9
    autoStartOnAssign: true
    columns:
      - name: In Progress
        action: dispatch_agent
        agentId: rex-coder
      - name: Done
        action: close_and_notify
