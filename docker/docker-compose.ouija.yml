# Ouija-only compose (default — BYO kanban).
# Use this when you already have a kanban board (Plane, Jira, Linear, etc.)
# and just want to run Ouija + its required infrastructure.
#
# Total RAM: ~1.5GB
#
# Usage:
#   docker compose -f docker/docker-compose.ouija.yml up -d
#
# Required env (copy .env.example → .env, then run infra/setup.sh):
#   OUIJA_SECRET_KEY — at least 32 characters, generated by setup.sh

services:
  ouija:
    # Prebuilt image from GHCR. Self-hosters who ran `npx @ouija-dev/cli init`
    # pull this; there's no source to build from. Devs with the monorepo can
    # override: `OUIJA_IMAGE=ouija:dev docker compose build && ... up`.
    image: ${OUIJA_IMAGE:-ghcr.io/muhammadkh4n/ouija:0.4.0}
    # Keep the build stanza so `docker compose build` works in the monorepo.
    # It's ignored by `up` unless `--build` is passed.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
    # No env_file: Docker Compose auto-discovers `.env` from --project-directory
    # which the Ouija CLI pins to the user's project root. A `../.env` relative
    # path here would walk one level too high when --project-directory is set.
    environment:
      OUIJA_SECRET_KEY: ${OUIJA_SECRET_KEY}
      # Admin API key — created by `ouija init`, used by the dashboard +
      # curl-driven flows. Empty in the scaffold; self-hosters uncomment
      # the OUIJA_API_KEY line in .env to enable REST API access.
      OUIJA_API_KEY: ${OUIJA_API_KEY:-}
      OUIJA_DATABASE_URL: postgres://ouija:ouija@postgres:5432/ouija_db
      OUIJA_REDIS_URL: redis://ouija-redis:6379
      OUIJA_SERVER_URL: ${OUIJA_SERVER_URL:-http://localhost:4000}
      # Forwarded to the agent subprocess so it can push commits and open PRs
      # via the bundled `gh` CLI. Optional — omit for read-only dry runs.
      GITHUB_PAT: ${GITHUB_PAT:-}
      PLANE_WEBHOOK_SECRET: ${PLANE_WEBHOOK_SECRET:-}
      PLANE_API_TOKEN: ${PLANE_API_TOKEN:-}
      PLANE_BASE_URL: ${PLANE_BASE_URL:-https://app.plane.so}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      OUIJA_WORKER_CONCURRENCY: ${OUIJA_WORKER_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # User's agent config — generated by `ouija init`, edited to point at
      # their repos + agents. Without this mount the server boots with env-
      # var defaults (no agents defined) and dispatches no-op.
      - ./ouija.config.yaml:/app/ouija.config.yaml:ro
      # Subscription auth (optional). Self-hosters running runner: local or
      # runner: stream-json bind-mount ~/.claude/ read-only so the bundled
      # Claude CLI picks up their Pro/Max session. API-billed setups can
      # omit this mount.
      - ${HOME}/.claude:/home/node/.claude:ro
    depends_on:
      postgres:
        condition: service_healthy
      ouija-redis:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    # /tmp + /home/node must be writable even with read_only: true
    # (Node.js temp files, BullMQ, gh CLI scratch). The .claude bind mount
    # above overlays inside /home/node; Docker handles the layering.
    tmpfs:
      - /tmp
      - /home/node
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ouija
      POSTGRES_PASSWORD: ouija
      POSTGRES_DB: ouija_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once when the data directory is first created.
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouija"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  ouija-redis:
    image: valkey/valkey:7.2-alpine
    # Load the config file with noeviction policy (BullMQ requirement).
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../infra/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
