# Fizzy compose: Fizzy kanban + ouija infrastructure (Postgres, Redis).
# Ouija server runs directly on the Mac (where Claude Code CLI lives).
#
# Usage:
#   docker compose -f docker/docker-compose.fizzy.yml up -d
#   node packages/server/dist/index.js
#
# Fizzy UI: http://localhost:3333
# Postgres: localhost:5432
# Redis: localhost:6379

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ouija
      POSTGRES_PASSWORD: ouija
      POSTGRES_DB: ouija_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouija"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../infra/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fizzy:
    image: ghcr.io/basecamp/fizzy:main
    ports:
      - "3333:3000"
    environment:
      SECRET_KEY_BASE: ${FIZZY_SECRET_KEY:-ouija-dev-fizzy-secret-change-in-prod}
      BASE_URL: http://localhost:3333
    volumes:
      - fizzydata:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  pgdata:
  redisdata:
  fizzydata:
