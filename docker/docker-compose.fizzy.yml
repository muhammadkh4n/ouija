# Fizzy preset compose — Ouija + Fizzy kanban (37signals' OSS Basecamp fork).
# Phase 3 Task 11: rewritten as a true self-hoster compose (was previously a
# maintainer-dev pattern with no `ouija` service in-container; the dev
# pattern has moved to `docker-compose.dev.yml` for that use case).
#
# Total RAM: ~2GB (Ouija ~512MB + Postgres ~1GB + Redis ~256MB + Fizzy ~512MB).
#
# Usage:
#   docker compose -f docker/docker-compose.fizzy.yml up -d
#
# Required env (copy .env.example → .env, then run infra/setup.sh):
#   OUIJA_SECRET_KEY      — at least 32 characters, generated by setup.sh
#   FIZZY_SECRET_KEY      — Fizzy's Rails SECRET_KEY_BASE (any 64+ char hex)
#   FIZZY_ACCESS_TOKEN    — paste from Fizzy's user-admin page after first boot
#   FIZZY_WEBHOOK_SECRET  — generated by setup.sh; configure in Fizzy's webhook UI

services:
  ouija:
    # Prebuilt image from GHCR. Self-hosters who ran `npx @ouija-dev/cli init`
    # pull this; there's no source to build from. Devs with the monorepo can
    # override: `OUIJA_IMAGE=ouija:dev docker compose build && ... up`.
    image: ${OUIJA_IMAGE:-ghcr.io/muhammadkh4n/ouija:0.4.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
    environment:
      OUIJA_SECRET_KEY: ${OUIJA_SECRET_KEY}
      OUIJA_API_KEY: ${OUIJA_API_KEY:-}
      OUIJA_DATABASE_URL: postgres://ouija:ouija@postgres:5432/ouija_db
      OUIJA_REDIS_URL: redis://ouija-redis:6379
      OUIJA_SERVER_URL: ${OUIJA_SERVER_URL:-http://localhost:4000}
      GITHUB_PAT: ${GITHUB_PAT:-}
      # Fizzy plugin configuration. FIZZY_BASE_URL points at the in-network
      # service name; self-hosters who tunnel Fizzy externally can override.
      FIZZY_BASE_URL: ${FIZZY_BASE_URL:-http://fizzy:3000}
      FIZZY_ACCESS_TOKEN: ${FIZZY_ACCESS_TOKEN:-}
      FIZZY_WEBHOOK_SECRET: ${FIZZY_WEBHOOK_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Phase 3 Task 8 — Anthropic API key for the EnvProvider AuthProvider
      # path. Subscription-auth self-hosters can leave it empty;
      # KeychainProvider (macOS) or CredentialFileProvider (Linux/WSL) get
      # picked up by auto-detection in agent-worker.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      OUIJA_WORKER_CONCURRENCY: ${OUIJA_WORKER_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./ouija.config.yaml:/app/ouija.config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      ouija-redis:
        condition: service_healthy
      # Fizzy is a soft dependency — the server can boot without it (the
      # plugin loads lazily on first webhook), but the preset expects it
      # ready. `service_started` (not `_healthy`) keeps the boot fast in
      # case Fizzy's first-time DB migrations are still running.
      fizzy:
        condition: service_started
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    tmpfs:
      - /tmp
      - /home/node
      # Phase 3 Task 8 — per-dispatch materialised Claude home dirs.
      - /run/ouija/claude-home
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ouija
      POSTGRES_PASSWORD: ouija
      POSTGRES_DB: ouija_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouija"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  ouija-redis:
    image: valkey/valkey:7.2-alpine
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../infra/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  fizzy:
    image: ghcr.io/basecamp/fizzy:main
    ports:
      - "3333:3000"
    environment:
      SECRET_KEY_BASE: ${FIZZY_SECRET_KEY:-ouija-dev-fizzy-secret-change-in-prod}
      BASE_URL: ${FIZZY_BASE_URL_PUBLIC:-http://localhost:3333}
    volumes:
      - fizzydata:/rails/storage
    healthcheck:
      # Rails apps expose `/up` for readiness; falling back to `/` would
      # 30x-redirect into the login flow and produce a curl exit 22 on -f.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  fizzydata:
