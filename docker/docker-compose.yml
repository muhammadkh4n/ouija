# Full-stack compose: Ouija + Plane ("batteries included").
# Use this when you want Ouija to manage a Plane kanban board hosted locally.
#
# Total RAM: ~4.8GB (requires a machine with 8GB+ available)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Required env (copy .env.example → .env, then run infra/setup.sh):
#   OUIJA_SECRET_KEY     — at least 32 characters, generated by setup.sh
#   PLANE_SECRET_KEY     — at least 32 characters, generated by setup.sh
#   PLANE_WEBHOOK_SECRET — the <secret> segment in the webhook URL
#
# Webhook URL to configure in Plane (Settings → Webhooks):
#   http://ouija:4000/hooks/plane/<PLANE_WEBHOOK_SECRET>
# Docker DNS resolves "ouija" to the container IP — Plane's localhost block does not apply.

services:
  # ---------- Ouija ----------

  ouija:
    # Prebuilt image from GHCR for self-hosters who ran `npx @ouija-dev/cli init`.
    # Dev override: `OUIJA_IMAGE=ouija:dev docker compose build && ... up`.
    image: ${OUIJA_IMAGE:-ghcr.io/muhammadkh4n/ouija:0.4.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
    environment:
      OUIJA_SECRET_KEY: ${OUIJA_SECRET_KEY}
      # Admin API key — created by `ouija init`, used by the dashboard +
      # curl-driven flows. Empty in the scaffold; self-hosters uncomment
      # the OUIJA_API_KEY line in .env to enable REST API access.
      OUIJA_API_KEY: ${OUIJA_API_KEY:-}
      OUIJA_DATABASE_URL: postgres://ouija:ouija@postgres:5432/ouija_db
      OUIJA_REDIS_URL: redis://ouija-redis:6379
      # Anthropic API key — required for the `EnvProvider` AuthProvider path
      # (Phase 3 Task 8). Set in `.env` for API-billed self-hosters or CI.
      # Subscription-auth self-hosters can leave it empty; KeychainProvider
      # (macOS) or CredentialFileProvider (Linux/WSL) will be picked up by
      # the agent-worker's auto-detection instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Forwarded to the agent subprocess so it can push commits and open PRs
      # via the bundled `gh` CLI. Optional — omit for read-only dry runs.
      GITHUB_PAT: ${GITHUB_PAT:-}
      # Plane plugin configuration
      PLANE_BASE_URL: http://plane-aio:80
      PLANE_API_TOKEN: ${PLANE_API_TOKEN:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      PLANE_WEBHOOK_SECRET: ${PLANE_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # User's agent config — generated by `ouija init`, edited to point at
      # their repos + agents. Without this mount the server boots with env-
      # var defaults (no agents defined) and dispatches no-op.
      - ./ouija.config.yaml:/app/ouija.config.yaml:ro
      # Phase 3 Task 8: NO `${HOME}/.claude` bind mount any more. The agent-
      # worker auto-detects an `AuthProvider` (env / credential-file / helper-
      # command / Keychain) and materialises a fresh per-dispatch home under
      # `/run/ouija/claude-home/<dispatchId>/` — see the `tmpfs` mount below.
      # Self-hosters using subscription auth need to set up a credential
      # provider that runs on the host (KeychainProvider on macOS reads via
      # `security find-generic-password` from outside the container; on Linux
      # set ANTHROPIC_API_KEY for the `EnvProvider` path or wire a
      # HelperCommandProvider against your secrets store).
    depends_on:
      postgres:
        condition: service_healthy
      ouija-redis:
        condition: service_healthy
      plane-aio:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    tmpfs:
      - /tmp
      # gh CLI + git credential helper need a writable home for per-dispatch
      # scratch (auth cache, short-lived tokens). /home/node maps to the
      # non-root user.
      - /home/node
      # Phase 3 Task 8: per-dispatch materialised Claude home dirs land
      # here. The agent-worker writes `<dispatchId>/.credentials.json`
      # (mode 0600) + neutral settings.json + .claude.json before each
      # dispatch and cleans up on completion. tmpfs gives us isolation
      # from the host fs, automatic cleanup on container restart, and
      # prevents an OOM-during-shutdown from leaving stale credentials.
      - /run/ouija/claude-home
    restart: unless-stopped

  # ---------- Database ----------

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ouija
      POSTGRES_PASSWORD: ouija
      POSTGRES_DB: ouija_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once on first start:
      #   01-create-databases.sql — creates plane_db + restricts cross-db access
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouija"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ---------- Ouija Redis (BullMQ — noeviction) ----------

  ouija-redis:
    image: valkey/valkey:7.2-alpine
    # noeviction policy: BullMQ delayed jobs must never be evicted.
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../infra/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ---------- Plane Redis (cache — allkeys-lru) ----------
  # Separate instance so Plane cache pressure cannot evict Ouija BullMQ jobs.

  plane-redis:
    image: valkey/valkey:7.2-alpine
    # allkeys-lru: Plane uses Redis as an ephemeral cache, LRU eviction is correct.
    command: >
      valkey-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ---------- RabbitMQ (Plane Celery broker) ----------

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ---------- MinIO (Plane file storage) ----------

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-plane-minio-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ---------- Plane AIO ----------
  # PINNED: makeplane/plane-aio@v0.23-dev — do not upgrade without testing the
  # webhook payload format, because Ouija's plugin-plane parser is coupled to it.
  # Check https://github.com/makeplane/plane/releases before upgrading.

  plane-aio:
    image: makeplane/plane-aio:v0.23-dev
    environment:
      # Plane reads its own config from environment variables.
      # DATABASE_URL points to a separate plane_db schema on the shared Postgres instance.
      DATABASE_URL: postgres://ouija:ouija@postgres:5432/plane_db
      REDIS_URL: redis://plane-redis:6379
      AMQP_URL: amqp://plane:plane@rabbitmq:5672/
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plane}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-plane-minio-secret}
      AWS_S3_BUCKET_NAME: plane-uploads
      SECRET_KEY: ${PLANE_SECRET_KEY:-change-me-in-production}
      WEB_URL: ${PLANE_WEB_URL:-http://localhost:4000/board}
      # Disable Plane's internal SMTP (Ouija handles notifications)
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    # Plane is not exposed on the host by default. Ouija proxies /board/* → plane-aio:80
    # via @fastify/http-proxy. To access Plane directly for debugging, add:
    #   ports:
    #     - "3000:80"
    depends_on:
      postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
