# Dev compose: Full Plane stack with host-exposed ports.
# Ouija server runs directly on the Mac (where Claude Code CLI lives).
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml --env-file ../.env up -d
#   node packages/server/dist/index.js
#
# Plane UI: http://localhost:3000
# Postgres: localhost:5432
# Redis: localhost:6379

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ouija
      POSTGRES_PASSWORD: ouija
      POSTGRES_DB: ouija_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouija"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../infra/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  plane-redis:
    image: valkey/valkey:7.2-alpine
    command: >
      valkey-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plane
      MINIO_ROOT_PASSWORD: plane-minio-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-aio:
    image: makeplane/plane-aio-community:stable
    ports:
      - "3333:80"
    volumes:
      - planedata:/app/data
      - planelogs:/app/logs
    environment:
      DOMAIN_NAME: localhost
      DATABASE_URL: postgres://ouija:ouija@postgres:5432/plane_db
      REDIS_URL: redis://plane-redis:6379
      AMQP_URL: amqp://plane:plane@rabbitmq:5672/
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: plane
      AWS_SECRET_ACCESS_KEY: plane-minio-secret
      AWS_S3_BUCKET_NAME: plane-uploads
      AWS_REGION: us-east-1
      SECRET_KEY: ${PLANE_SECRET_KEY:-ouija-dev-plane-secret-key-change-in-prod}
      WEB_URL: http://localhost:3333
      APP_PROTOCOL: http
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    depends_on:
      postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  planedata:
  planelogs:
